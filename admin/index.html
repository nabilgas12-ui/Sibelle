<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/png" href="../images/logo.png">
  <link rel="apple-touch-icon" href="../images/logo.png">
  <title>لوحة التحكم | Si Belle</title>
  <link rel="preconnect" href="https://jmqyganibaayodsrdxxl.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body class="rtl">
  <!-- LOGIN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-logo">
        <img src="../images/logo.png" alt="Si Belle">
        <h1>Si Belle</h1>
        <p>لوحة تحكم المتجر · Administration</p>
      </div>
      <div class="login-error" id="loginError" style="display:none;color:#c0392b;background:#fdecea;padding:10px 12px;border-radius:8px;margin-bottom:14px;font-size:0.9rem;line-height:1.45"></div>
      <form id="loginForm" onsubmit="event.preventDefault(); handleLogin(event); return false;">
        <div class="form-group">
          <label>البريد الإلكتروني / Email</label>
          <input type="email" id="loginUser" autocomplete="username" required placeholder="admin@sibelle.dz">
        </div>
        <div class="form-group">
          <label>كلمة المرور / Mot de passe</label>
          <input type="password" id="loginPass" autocomplete="current-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-login">دخول · Connexion</button>
      </form>
      <div class="login-demo" style="font-size:0.8rem;opacity:.75;margin-top:12px">
        استخدم حساب Supabase Auth (admin@sibelle.dz)
      </div>
    </div>
  </div>

  <!-- APP -->
  <div class="app" id="app">
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="../images/logo.png" alt="">
        <div>
          <span>Si <em>Belle</em></span>
          <small>Admin Panel</small>
        </div>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-page="dashboard" onclick="showPage('dashboard')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span class="nav-label">الرئيسية</span>
        </button>
        <button class="nav-item" data-page="orders" onclick="showPage('orders')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="nav-label">الطلبات</span>
          <span class="nav-badge" id="ordersBadge" style="display:none">0</span>
        </button>
        <button class="nav-item" data-page="analytics" onclick="showPage('analytics')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
          <span class="nav-label">التحليلات</span>
        </button>
        <button class="nav-item" data-page="map" onclick="showPage('map')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <span class="nav-label">خريطة المبيعات</span>
        </button>
        <button class="nav-item" data-page="products" onclick="showPage('products')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          <span class="nav-label">المنتجات</span>
        </button>
        <button class="nav-item" data-page="categories" onclick="showPage('categories')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span class="nav-label">التصنيفات</span>
        </button>
        <button class="nav-item" data-page="staff" onclick="showPage('staff')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="nav-label">الموظفون</span>
        </button>
        <button class="nav-item" data-page="content" onclick="showPage('content')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span class="nav-label">النصوص</span>
        </button>
        <button class="nav-item" data-page="shipping" onclick="showPage('shipping')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
          <span class="nav-label">التوصيل</span>
        </button>
        <button class="nav-item" data-page="payments" onclick="showPage('payments')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h2"/></svg>
          <span class="nav-label">طرق الدفع</span>
        </button>
        <button class="nav-item" data-page="invoice" onclick="showPage('invoice')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h8M8 17h5"/></svg>
          <span class="nav-label">الفاتورة</span>
        </button>
        <button class="nav-item" data-page="settings" onclick="showPage('settings')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <span class="nav-label">الإعدادات</span>
        </button>
      </nav>
      <div class="sidebar-footer">
        <button class="btn-logout" id="logoutBtn" onclick="logout()">تسجيل الخروج</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="menu-btn-mobile" onclick="openSidebar()" aria-label="Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
          <h2 id="pageTitle">الرئيسية</h2>
        </div>
        <div class="topbar-actions">
          <span class="badge-live">● Live</span>
          <div class="lang-switch-admin">
            <button type="button" data-lang="ar" class="active" onclick="setAdminLang('ar')">عربي</button>
            <button type="button" data-lang="fr" onclick="setAdminLang('fr')">FR</button>
          </div>
          <button class="icon-btn-top" onclick="toggleAdminTheme()" title="Theme" aria-label="Theme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <a href="../index.html" target="_blank" class="btn btn-ghost btn-sm">المتجر ↗</a>
        </div>
      </header>
      <div class="content" id="pageContent"></div>
    </div>
  </div>

  <div id="modalRoot"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
